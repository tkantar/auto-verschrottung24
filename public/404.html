<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#17352b" />
    <title>Seite nicht gefunden | Auto-Verschrottung24</title>
    <style>
      :root { font-family: "Segoe UI", Arial, sans-serif; color: #15211d; background: #f3f5f0; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
      main { width: min(560px, calc(100% - 32px)); padding: 48px; box-sizing: border-box; border-radius: 16px; background: #fff; box-shadow: 0 20px 60px rgba(21, 33, 29, .1); }
      p { color: #66736e; line-height: 1.6; }
      a { display: inline-block; margin-top: 12px; padding: 14px 20px; border-radius: 9px; color: #15211d; background: #c8ef45; font-weight: 800; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>Seite nicht gefunden</h1>
      <p>Die gewünschte Seite existiert nicht oder wurde verschoben.</p>
      <a href="/">Zur Startseite</a>
    </main>
  </body>
</html>
